<style>
  :root {
    color-scheme: light;
    --ground:#eef2f6; --surface:#ffffff; --surface-2:#f3f6f9;
    --ink:#14202e; --ink-2:#44556a; --muted:#78889b;
    --rule:#dde3ea; --rule-strong:#c3ccd6;
    --navy:#102f52; --navy-2:#1d4674;
    --accent:#2a5f9e; --pos:#14733f; --neg:#a32b23;
    --s1:#2a5f9e; --s2:#c1571d; --s3:#0f8f6f; --s0:#737b85;
    --bar:#dbe4ef;
    --g1:#2a5f9e; --g2:#c1571d; --g3:#0f8f6f; --g4:#b8860b; --g5:#9c5c8f;
    --g6:#2f7a2f; --g7:#4a3aa7; --g8:#c0392b; --g9:#737b85;
    --sans:Lato, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono:Lato, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:#0b1520; --surface:#101c29; --surface-2:#17273a;
      --ink:#e7edf4; --ink-2:#a9b7c6; --muted:#7e8d9e;
      --rule:#23364b; --rule-strong:#35495f;
      --navy:#0d2033; --navy-2:#173553;
      --accent:#4a86cf; --pos:#3fae6b; --neg:#e0665a;
      --s1:#5b9ae0; --s2:#e08040; --s3:#1db894; --s0:#8e98a5;
      --bar:#24384f;
      --g1:#5b9ae0; --g2:#e08040; --g3:#1db894; --g4:#d2a521; --g5:#c084b4;
      --g6:#52a852; --g7:#8a80e8; --g8:#e0655a; --g9:#8e98a5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:#0b1520; --surface:#101c29; --surface-2:#17273a;
    --ink:#e7edf4; --ink-2:#a9b7c6; --muted:#7e8d9e;
    --rule:#23364b; --rule-strong:#35495f;
    --navy:#0d2033; --navy-2:#173553;
    --accent:#4a86cf; --pos:#3fae6b; --neg:#e0665a;
    --s1:#5b9ae0; --s2:#e08040; --s3:#1db894; --s0:#8e98a5;
    --bar:#24384f;
    --g1:#5b9ae0; --g2:#e08040; --g3:#1db894; --g4:#d2a521; --g5:#c084b4;
    --g6:#52a852; --g7:#8a80e8; --g8:#e0655a; --g9:#8e98a5;
  }

  body { background:var(--ground); color:var(--ink); font-family:var(--sans); line-height:1.5; }
  .wrap { max-width:1180px; margin:0 auto; padding-inline:22px; padding-block:0 60px; }
  h1,h2,h3 { text-wrap:balance; margin:0; font-weight:700; letter-spacing:-0.005em; }
  h1 { font-size:clamp(22px,3vw,30px); }
  h2 { font-size:13px; font-weight:700; letter-spacing:0.085em; text-transform:uppercase; color:var(--navy); }
  p { margin:0; max-width:74ch; color:var(--ink-2); }
  a { color:var(--accent); }
  .eyebrow { font-size:11px; letter-spacing:0.11em; text-transform:uppercase; color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; }

  /* masthead: a navy band, like the cover strip of a client deck */
  header.top { background:var(--navy); color:#fff; }
  header.top .wrap { display:flex; flex-direction:column; gap:6px; padding-block:22px 20px; }
  header.top h1 { color:#fff; }
  header.top .eyebrow { color:#8fabc9; }
  .subtitle { font-size:14px; color:#c3d6e8; max-width:80ch; }
  .meta { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:11px; letter-spacing:0.06em;
          text-transform:uppercase; color:#8fabc9; margin-top:6px; }

  nav.tabs { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--rule); }
  nav.tabs .wrap { display:flex; gap:0; overflow-x:auto; padding-block:0; }
  nav.tabs button { appearance:none; background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
                    font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:0.09em;
                    text-transform:uppercase; color:var(--ink-2); padding:13px 16px 11px; white-space:nowrap; }
  nav.tabs button[aria-selected="true"] { color:var(--navy); border-bottom-color:var(--accent); }
  nav.tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

  section.panel { display:none; padding-top:24px; }
  section.panel.active { display:block; }
  .stack { display:flex; flex-direction:column; gap:20px; }
  .row { display:grid; gap:16px; }
  @media (min-width:820px) { .row.two { grid-template-columns:1fr 1fr; } .row.three { grid-template-columns:repeat(3,1fr); } }

  /* every block is an exhibit: hairline frame, navy rule on top, no rounding */
  .card { background:var(--surface); border:1px solid var(--rule); border-top:2px solid var(--navy);
          padding:13px 16px 10px; }
  .card > h2 { margin-bottom:3px; }
  .card .note { font-size:12px; color:var(--muted); margin-top:5px; }

  .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0;
           border:1px solid var(--rule); border-top:2px solid var(--navy); background:var(--surface); }
  .strip > div { padding:13px 16px 15px; display:flex; flex-direction:column; gap:2px;
                 border-left:1px solid var(--rule); position:relative; overflow:hidden; }
  .strip .spark { position:absolute; right:0; bottom:0; width:62%; height:52%; opacity:.16; }
  .strip .name, .strip .big, .strip .sub, .strip .delta { position:relative; z-index:1; }
  .strip > div:first-child { border-left:0; }
  .strip .name { display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:900;
                 letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-2); }
  .swatch { width:14px; height:3px; border-radius:0; flex:none; }
  .strip .big { font-size:52px; font-weight:900; letter-spacing:-0.035em; line-height:1;
                font-variant-numeric:tabular-nums;
                margin-top:5px; line-height:1.05; }
  .strip .delta { font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .strip .sub { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .delta.pos { color:var(--pos); } .delta.neg { color:var(--neg); }

  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  .scroll { overflow-x:auto; }
  th, td { padding:6px 10px; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; font-weight:700;
             color:#fff; background:var(--navy); border-bottom:0; }
  tbody td { font-variant-numeric:tabular-nums; color:var(--ink); }
  tbody td:first-child { color:var(--ink-2); }
  tbody tr:nth-child(even) td { background:var(--surface-2); }
  tbody tr:hover td { background:color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  td.pos { color:var(--pos); } td.neg { color:var(--neg); }
  td.left { text-align:left; white-space:normal; color:var(--ink); }
  footer .disclaimer { margin-top:10px; padding-left:11px; border-left:3px solid var(--accent);
                       color:var(--ink-2); }
  .note-block { margin:14px 0 0; padding:12px 15px; border-left:3px solid var(--accent);
                background:var(--surface-2); font-size:13px; line-height:1.55; color:var(--ink-2); }
  .note-block b { color:var(--ink); }
  .note-block ul { margin:0; padding-left:18px; }
  .note-block li + li { margin-top:7px; }
  /* the rows that drive the risk story read heavier than the rest */
  tbody tr.lead td { font-weight:800; color:var(--navy); }
  tbody tr.lead td:first-child { color:var(--ink); }
  :root[data-theme="dark"] tbody tr.lead td { color:var(--ink); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) tbody tr.lead td { color:var(--ink); }
  }

  .chart { width:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:11.5px; color:var(--ink-2); margin:4px 0 2px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }

  .controls { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; }
  .controls label { display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700;
                    letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-2); min-width:170px; }
  .controls output { font-variant-numeric:tabular-nums; color:var(--ink); font-size:13px; font-weight:700;
                     letter-spacing:0; text-transform:none; }
  input[type=range] { accent-color:var(--accent); width:100%; }
  .seg { display:inline-flex; border:1px solid var(--rule-strong); overflow:hidden; }
  .seg button { appearance:none; border:0; background:var(--surface); color:var(--ink-2); font-family:var(--sans);
                font-size:11.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
                padding:7px 13px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  .prose { display:flex; flex-direction:column; gap:11px; font-size:13.5px; }
  .prose h3 { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
              color:var(--navy); margin-top:6px; }
  /* ---- motion: one entrance per view, replayed when a tab is opened ---- */
  @keyframes chartDraw { to { stroke-dashoffset:0; } }
  @keyframes chartGrowX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes chartGrowY { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes riseIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  section.panel.active > .strip > div { animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both; }
  section.panel.active > .strip > div:nth-child(2) { animation-delay:.07s; }
  section.panel.active > .strip > div:nth-child(3) { animation-delay:.14s; }
  section.panel.active > .strip > div:nth-child(4) { animation-delay:.21s; }
  .card, .strip > div, tbody tr { transition:background .15s ease, border-color .15s ease; }
  .card:hover { border-color:var(--rule-strong); }
  @media (prefers-reduced-motion: reduce) {
    section.panel.active > .strip > div { animation:none; }
  }

  footer { margin-top:30px; padding-top:12px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--muted); }
  .warn { background:#fdf3d7; color:#5c4400; border:1px solid #e2c877; padding:10px 14px; font-size:13px; }

  /* the navy furniture flips to the light accent in either dark state */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) h2,
    :root:not([data-theme="light"]) .prose h3,
    :root:not([data-theme="light"]) nav.tabs button[aria-selected="true"] { color:var(--ink); }
    :root:not([data-theme="light"]) .card,
    :root:not([data-theme="light"]) .strip { border-top-color:var(--accent); }
    :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background:var(--accent); }
    :root:not([data-theme="light"]) thead th { background:var(--surface-2); color:var(--ink); }
  }
  :root[data-theme="dark"] h2,
  :root[data-theme="dark"] .prose h3,
  :root[data-theme="dark"] nav.tabs button[aria-selected="true"] { color:var(--ink); }
  :root[data-theme="dark"] .card,
  :root[data-theme="dark"] .strip { border-top-color:var(--accent); }
  :root[data-theme="dark"] .seg button[aria-pressed="true"] { background:var(--accent); }
  :root[data-theme="dark"] thead th { background:var(--surface-2); color:var(--ink); }
</style>

<script>/* Minimal SVG chart layer: line, horizontal bars (grouped/stacked), vertical bars,
   waterfall and line+markers. No dependencies, theme-token aware, redraws on resize.
   Specs follow the house style: 2px lines, <=24px bars with 4px rounded data ends,
   2px surface gaps between touching fills, hairline grid, crosshair tooltip. */
(function (global) {
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const SVG = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const fmtPct = (v, d = 0) => (v * 100).toFixed(d) + "%";
  const col = c => (typeof c === "string" && c.startsWith("--")) ? css(c) : c;
  /* Same hue, washed out: lets one portfolio keep one colour and still show sign. */
  const fade = (c, a) => {
    const h = col(c).trim();
    const m = /^#?([0-9a-f]{6})$/i.exec(h);
    if (!m) return h;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };
  const niceTicks = (lo, hi, count = 5) => {
    if (!isFinite(lo) || !isFinite(hi) || lo === hi) return [lo];
    const span = hi - lo;
    const step0 = Math.pow(10, Math.floor(Math.log10(span / count)));
    const err = span / count / step0;
    const step = step0 * (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1);
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(Math.round(v / step) * step);
    return out;
  };

  const REGISTRY = [];

  class Chart {
    constructor(host, opts) {
      this.host = host;
      this.opts = opts;
      REGISTRY.push(this);
      host.style.position = "relative";
      this.tip = document.createElement("div");
      Object.assign(this.tip.style, {
        position: "absolute", pointerEvents: "none", opacity: "0", transition: "opacity .08s",
        background: "var(--surface)", border: "1px solid var(--rule-strong)", borderRadius: "5px",
        padding: "7px 9px", font: "500 11.5px var(--mono)", color: "var(--ink)",
        boxShadow: "0 2px 10px rgba(0,0,0,.10)", zIndex: "5", whiteSpace: "nowrap",
      });
      host.appendChild(this.tip);
      this.draw();
      new ResizeObserver(() => this.draw()).observe(host);
      const redraw = () => setTimeout(() => this.draw(), 30);
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
      new MutationObserver(redraw).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
    }
    showTip(html, x, y) {
      this.tip.innerHTML = "";
      this.tip.appendChild(html);
      this.tip.style.opacity = "1";
      const w = this.tip.offsetWidth, hw = this.host.clientWidth;
      this.tip.style.left = Math.max(4, Math.min(hw - w - 4, x - w / 2)) + "px";
      this.tip.style.top = Math.max(0, y - this.tip.offsetHeight - 12) + "px";
    }
    hideTip() { this.tip.style.opacity = "0"; }
    draw() {
      const w = this.host.clientWidth || 640;
      if (this.svg) this.svg.remove();
      this.svg = mk("svg", {width: "100%", height: String(this.opts.height), viewBox: `0 0 ${w} ${this.opts.height}`,
                            role: "img", "aria-label": this.opts.label || ""});
      this.svg.style.display = "block";
      this.host.appendChild(this.svg);
      this.render(this.svg, w, this.opts.height);
      this.animate();
    }
    /* One entrance per chart: lines draw themselves, bars grow off the axis.
       Re-running draw() replays it, which is how a tab switch re-animates. */
    animate() {
      const kind = this.opts.animate;
      if (!kind || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (kind === "line") {
        this.svg.querySelectorAll("path[data-line]").forEach((el, i) => {
          const len = el.getTotalLength ? el.getTotalLength() : 4000;
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          el.style.animation = `chartDraw 1.4s cubic-bezier(.25,.8,.3,1) ${i * 0.12}s forwards`;
        });
        return;
      }
      const g = this.svg.querySelector("g[data-bars]");
      if (!g) return;
      g.style.transformBox = "fill-box";
      g.style.transformOrigin = {barsL: "left center", barsR: "right center", barsUp: "center bottom"}[kind];
      g.style.animation = (kind === "barsUp" ? "chartGrowY" : "chartGrowX")
                          + " .8s cubic-bezier(.2,.85,.25,1) both";
    }
    tipRow(color, label, value) {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:7px;justify-content:space-between";
      const left = document.createElement("span");
      left.style.cssText = "display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)";
      const key = document.createElement("i");
      key.style.cssText = `width:12px;height:2px;background:${color};display:inline-block;flex:none`;
      left.appendChild(key);
      left.appendChild(document.createTextNode(label));
      const right = document.createElement("strong");
      right.textContent = value;
      row.appendChild(left); row.appendChild(right);
      return row;
    }
  }

  /* series: [{name, color, x:[dates], y:[values]}] ; opts.fmt(v) */
  class LineChart extends Chart {
    render(svg, W, H) {
      const o = this.opts, S = o.series;
      const pad = {l: 52, r: 14, t: 10, b: 26};
      const n = S[0].y.length;
      const all = S.flatMap(s => s.y).filter(v => v !== null && isFinite(v));
      let lo = Math.min(...all), hi = Math.max(...all);
      if (o.zero) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
      const ticks = niceTicks(lo, hi, 5);
      lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
      const X = i => pad.l + (W - pad.l - pad.r) * (n === 1 ? 0.5 : i / (n - 1));
      const Y = v => H - pad.b - (H - pad.t - pad.b) * (v - lo) / (hi - lo || 1);
      ticks.forEach(t => {
        svg.appendChild(mk("line", {x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t),
                                    stroke: t === 0 ? css("--rule-strong") : css("--rule"), "stroke-width": 1}));
        const lb = mk("text", {x: pad.l - 8, y: Y(t) + 3.5, "text-anchor": "end", fill: css("--muted"),
                               "font-size": 10.5, "font-family": "var(--mono)"});
        lb.textContent = o.fmt(t);
        svg.appendChild(lb);
      });
      // x labels: first of each year
      const seen = new Set();
      S[0].x.forEach((d, i) => {
        const y = String(d).slice(0, 4);
        if (seen.has(y) || i < 2) { seen.add(y); return; }
        seen.add(y);
        const t = mk("text", {x: X(i), y: H - 8, "text-anchor": "middle", fill: css("--muted"),
                              "font-size": 10.5, "font-family": "var(--mono)"});
        t.textContent = y;
        svg.appendChild(t);
      });
      S.forEach(s => {
        let d = "";
        s.y.forEach((v, i) => { if (v === null || !isFinite(v)) return; d += (d ? "L" : "M") + X(i) + " " + Y(v); });
        if (o.area) {
          const a = mk("path", {d: d + `L${X(n - 1)} ${Y(0)}L${X(0)} ${Y(0)}Z`, fill: col(s.color), opacity: 0.10});
          svg.appendChild(a);
        }
        svg.appendChild(mk("path", {d, fill: "none", stroke: col(s.color), "stroke-width": s.width || 2,
                                    "stroke-linejoin": "round", "stroke-linecap": "round",
                                    "data-line": "1"}));
      });
      /* Threshold lines: the level a monitor triggers at, drawn where the eye
         already is rather than described in the caption. */
      (o.hlines || []).forEach(h => {
        svg.appendChild(mk("line", {x1: pad.l, x2: W - pad.r, y1: Y(h.value), y2: Y(h.value),
                                    stroke: col(h.color || "--neg"), "stroke-width": 1.2,
                                    "stroke-dasharray": "5 4"}));
        if (h.text) {
          const t = mk("text", {x: pad.l + 4, y: Y(h.value) - 5, fill: col(h.color || "--neg"),
                                "font-size": 10.5, "font-weight": 700});
          t.textContent = h.text;
          svg.appendChild(t);
        }
      });
      /* Callouts: point at the tallest reading inside a date window, so the rest of
         the chart is read relative to it rather than hovered for. */
      (o.notes || []).forEach(nt => {
        let bi = -1, bv = -Infinity;
        S.forEach(s => s.y.forEach((v, i) => {
          const d = String(s.x[i]);
          if (v === null || !isFinite(v) || d < nt.from || d > nt.to) return;
          if (v > bv) { bv = v; bi = i; }
        }));
        if (bi < 0) return;
        const px = X(bi), py = Y(bv);
        const right = px < W * 0.62;
        const tx = px + (right ? 26 : -26), ty = Math.max(pad.t + 12, py - 20);
        svg.appendChild(mk("line", {x1: px, y1: py - 3, x2: tx, y2: ty + 3,
                                    stroke: css("--muted"), "stroke-width": 1}));
        const t = mk("text", {x: tx + (right ? 4 : -4), y: ty, "text-anchor": right ? "start" : "end",
                              fill: css("--ink-2"), "font-size": 10.5, "font-weight": 700});
        t.textContent = nt.text;
        svg.appendChild(t);
        const bb = t.getBBox();
        const bg = mk("rect", {x: bb.x - 4, y: bb.y - 3, width: bb.width + 8, height: bb.height + 6,
                               fill: "var(--surface)", stroke: css("--rule-strong"), "stroke-width": 1, rx: 2});
        svg.insertBefore(bg, t);
      });
      const cross = mk("line", {y1: pad.t, y2: H - pad.b, stroke: css("--rule-strong"), "stroke-width": 1, opacity: 0});
      svg.appendChild(cross);
      const dots = S.map(s => {
        const c = mk("circle", {r: 4, fill: col(s.color), stroke: css("--surface"), "stroke-width": 2, opacity: 0});
        svg.appendChild(c);
        return c;
      });
      const hit = mk("rect", {x: pad.l, y: pad.t, width: Math.max(1, W - pad.l - pad.r), height: Math.max(1, H - pad.t - pad.b),
                              fill: "transparent"});
      svg.appendChild(hit);
      const move = ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const i = Math.max(0, Math.min(n - 1, Math.round((px - pad.l) / ((W - pad.l - pad.r) / (n - 1 || 1)))));
        cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
        const box = document.createElement("div");
        const head = document.createElement("div");
        head.style.cssText = "color:var(--muted);margin-bottom:4px";
        head.textContent = S[0].x[i];
        box.appendChild(head);
        S.forEach((s, k) => {
          const v = s.y[i];
          dots[k].setAttribute("cx", X(i));
          dots[k].setAttribute("cy", Y(v === null ? lo : v));
          dots[k].setAttribute("opacity", v === null || !isFinite(v) ? 0 : 1);
          box.appendChild(this.tipRow(col(s.color), s.name, v === null || !isFinite(v) ? "n/a" : o.fmt(v, 2)));
        });
        this.showTip(box, X(i), pad.t + 10);
      };
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerleave", () => {
        this.hideTip(); cross.setAttribute("opacity", 0); dots.forEach(d => d.setAttribute("opacity", 0));
      });
    }
  }

  /* categories down the y axis; series [{name,color,x:[...]}]; mode group|stack */
  class BarsH extends Chart {
    render(svg, W, H) {
      const o = this.opts, S = o.series, cats = o.categories;
      const pad = {l: o.labelWidth || 150, r: 46, t: 8, b: 26};
      const vals = S.flatMap(s => s.x.filter(v => v !== null && isFinite(v)));
      const stackTot = cats.map((_, i) => S.reduce((a, s) => a + Math.max(0, s.x[i] || 0), 0));
      let lo = Math.min(0, ...vals), hi = o.mode === "stack" ? Math.max(...stackTot) : Math.max(0, ...vals);
      const ticks = niceTicks(lo, hi, 4);
      lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
      const X = v => pad.l + (W - pad.l - pad.r) * (v - lo) / (hi - lo || 1);
      const band = (H - pad.t - pad.b) / cats.length;
      ticks.forEach(t => {
        svg.appendChild(mk("line", {x1: X(t), x2: X(t), y1: pad.t, y2: H - pad.b,
                                    stroke: t === 0 ? css("--rule-strong") : css("--rule"), "stroke-width": 1}));
        const lb = mk("text", {x: X(t), y: H - 8, "text-anchor": "middle", fill: css("--muted"),
                               "font-size": 10.5, "font-family": "var(--mono)"});
        lb.textContent = o.fmt(t);
        svg.appendChild(lb);
      });
      // labels are right-aligned into the pad.l gutter, so they have to fit it
      const maxChars = Math.max(8, Math.floor((pad.l - 14) / 6.2));
      cats.forEach((cat, i) => {
        const lb = mk("text", {x: pad.l - 10, y: pad.t + band * (i + 0.5) + 4, "text-anchor": "end",
                               fill: css("--ink-2"), "font-size": 11.5});
        lb.textContent = cat.length > maxChars ? cat.slice(0, maxChars - 1) + "…" : cat;
        if (cat.length > maxChars) lb.appendChild(mk("title")).textContent = cat;
        svg.appendChild(lb);
      });
      const thick = Math.min(22, (band - 8) / (o.mode === "stack" ? 1 : S.length));
      const bars = mk("g", {"data-bars": "1"});
      svg.appendChild(bars);
      S.forEach((s, k) => {
        s.x.forEach((v, i) => {
          if (v === null || !isFinite(v)) return;
          let x0, x1, y;
          if (o.mode === "stack") {
            const prev = S.slice(0, k).reduce((a, q) => a + Math.max(0, q.x[i] || 0), 0);
            x0 = X(prev); x1 = X(prev + v); y = pad.t + band * (i + 0.5) - thick / 2;
          } else {
            x0 = X(Math.min(0, v)); x1 = X(Math.max(0, v));
            y = pad.t + band * i + (band - thick * S.length) / 2 + k * thick;
          }
          const r = mk("rect", {x: Math.min(x0, x1), y, width: Math.max(1, Math.abs(x1 - x0) - (o.mode === "stack" ? 2 : 0)),
                                height: Math.max(1, thick - (o.mode === "group" ? 2 : 0)), fill: col(s.color), rx: 2});
          r.style.cursor = "default";
          r.addEventListener("pointerenter", ev => {
            const box = document.createElement("div");
            const head = document.createElement("div");
            head.style.cssText = "color:var(--muted);margin-bottom:4px";
            head.textContent = cats[i];
            box.appendChild(head);
            box.appendChild(this.tipRow(col(s.color), s.name, o.fmt(v, 2)));
            const rect = svg.getBoundingClientRect();
            this.showTip(box, ev.clientX - rect.left, y + thick);
          });
          r.addEventListener("pointerleave", () => this.hideTip());
          bars.appendChild(r);
          if (o.labelEnds && o.mode === "group") {
            const t = mk("text", {x: (v >= 0 ? x1 + 5 : x0 - 5), y: y + thick / 2 + 3.5,
                                  "text-anchor": v >= 0 ? "start" : "end", fill: css("--muted"),
                                  "font-size": 10, "font-family": "var(--mono)"});
            t.textContent = o.fmt(v, 1);
            svg.appendChild(t);
          }
        });
      });
    }
  }

  /* vertical bars / waterfall: items [{label, value, color}] */
  class BarsV extends Chart {
    render(svg, W, H) {
      const o = this.opts, items = o.items;
      const pad = {l: 50, r: 12, t: 12, b: o.tall ? 56 : 30};
      let run = 0;
      const spans = items.map(d => {
        if (!o.waterfall) return [Math.min(0, d.value), Math.max(0, d.value)];
        if (d.total) return [Math.min(0, d.value), Math.max(0, d.value)];
        const a = run, b = run + d.value;
        run = b;
        return [Math.min(a, b), Math.max(a, b)];
      });
      let lo = Math.min(0, ...spans.map(s => s[0])), hi = Math.max(0, ...spans.map(s => s[1]));
      const ticks = niceTicks(lo, hi, 4);
      lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
      const Y = v => H - pad.b - (H - pad.t - pad.b) * (v - lo) / (hi - lo || 1);
      const band = (W - pad.l - pad.r) / items.length;
      ticks.forEach(t => {
        svg.appendChild(mk("line", {x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t),
                                    stroke: t === 0 ? css("--rule-strong") : css("--rule"), "stroke-width": 1}));
        const lb = mk("text", {x: pad.l - 8, y: Y(t) + 3.5, "text-anchor": "end", fill: css("--muted"),
                               "font-size": 10.5, "font-family": "var(--mono)"});
        lb.textContent = o.fmt(t);
        svg.appendChild(lb);
      });
      const thick = Math.min(30, band - 10);
      const bars = mk("g", {"data-bars": "1"});
      svg.appendChild(bars);
      items.forEach((d, i) => {
        const [a, b] = spans[i];
        const x = pad.l + band * i + (band - thick) / 2;
        if (o.waterfall && i > 0 && !items[i - 1].total) {

<script>
(function () {
  const D = JSON.parse(document.getElementById("payload").textContent);
  const META = D.meta;
  const ORDER = ["SAA", "MINVAR", "QV", "BENCH"];
  const NAMES = {SAA:"Strategic 60/40", MINVAR:"Minimum Variance", QV:"Quality-Value", BENCH:"Benchmark 60/40"};
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cvar = {SAA:"--s1", MINVAR:"--s2", QV:"--s3", BENCH:"--s0"};
  const C = c => css(cvar[c]);
  const SEGS = ["US Equity","Dev ex-US Equity","EM Equity","US Aggregate","TIPS","Treasuries","Credit","Gold","Cash","Global Equity"];
  const SEGVAR = ["--g1","--g2","--g3","--g4","--g5","--g6","--g7","--g8","--g9","--g9"];
  const segColor = s => css(SEGVAR[Math.max(0, SEGS.indexOf(s))]);
  const pct = (v, d=1) => v === null || v === undefined || Number.isNaN(v) ? "n/a" : (100*v).toFixed(d) + "%";
  const sgn = (v, d=1) => (v >= 0 ? "+" : "") + (100*v).toFixed(d) + "pp";
  const num = (v, d=2) => v === null || v === undefined || Number.isNaN(v) ? "n/a" : v.toFixed(d);
  const by = (rows, k, v) => rows.filter(r => r[k] === v);
  const el = (tag, attrs = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    (Array.isArray(kids) ? kids : [kids]).forEach(k => k && n.appendChild(k));
    return n;
  };
  const S = Object.fromEntries(D.summary.map(r => [r.code, r]));
  const YEARS = (new Date(META.backtest_end) - new Date(META.backtest_start)) / 31557600000;
  /* Thirteen years is a short sample; the t beside an information ratio is the
     honest way to say how much of the active return could be luck. */
  const tOfIR = ir => (ir === null || ir === undefined || isNaN(ir)) ? NaN : ir * Math.sqrt(YEARS);
  const pp = (v, d = 2) => ((Math.abs(v * 100) < 0.5 * Math.pow(10, -d) ? 0 : v * 100).toFixed(d)
                            .replace(/^(?!-)/, "+")) + "pp";
  /* A quiet block of prose that says what a number does and does not mean. */
  function note(html) {
    const n = el("div", {class:"note-block"});
    n.innerHTML = html;
    return n;
  }

  /* a tiny area chart drawn behind each headline number */
  function spark(values, colorVar) {
    const v = values.filter(x => x !== null && isFinite(x));
    if (v.length < 3) return null;
    const step = Math.max(1, Math.floor(v.length / 90));
    const pts = v.filter((_, i) => i % step === 0);
    const lo = Math.min(...pts), hi = Math.max(...pts), rng = (hi - lo) || 1;
    const W = 150, H = 40;
    const xy = pts.map((y, i) => [i * W / (pts.length - 1), H - (y - lo) / rng * (H - 3) - 1.5]);
    const line = xy.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" ");
    const g = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    g.setAttribute("class", "spark");
    g.setAttribute("viewBox", `0 0 ${W} ${H}`);
    g.setAttribute("preserveAspectRatio", "none");
    g.setAttribute("aria-hidden", "true");
    const fill = document.createElementNS(g.namespaceURI, "polygon");
    fill.setAttribute("points", `0,${H} ${line} ${W},${H}`);
    fill.setAttribute("fill", css(colorVar));
    const stroke = document.createElementNS(g.namespaceURI, "polyline");
    stroke.setAttribute("points", line);
    stroke.setAttribute("fill", "none");
    stroke.setAttribute("stroke", css(colorVar));
    stroke.setAttribute("stroke-width", "1.6");
    g.appendChild(fill); g.appendChild(stroke);
    return g;
  }

  // ---------------------------------------------------------------- chart helpers
  const fPct = (d0 = 0) => (v, d) => (100 * v).toFixed(d === undefined ? d0 : d) + "%";
  const fSgn = (d0 = 1) => (v, d) => (v >= 0 ? "+" : "") + (100 * v).toFixed(d === undefined ? d0 : d) + "%";
  const fNum = (d0 = 2, suffix = "") => (v, d) => v.toFixed(d === undefined ? d0 : d) + suffix;
  const fDollar = (v, d) => "$" + v.toFixed(d === undefined ? 0 : d);

  function table(headers, rows, opts = {}) {
    const t = el("table");
    const thead = el("thead");
    thead.appendChild(el("tr", {}, headers.map(h => el("th", {text:h}))));
    t.appendChild(thead);
    const tb = el("tbody");

      tb.appendChild(tr);

  };

  function leadRow(label, values, fmt) {

  const metaBits = [
    "Data: " + META.data, "Prices to " + META.prices_end,
    "Daily · USD · total return", "Costs charged on every trade",
  ];
  document.getElementById("meta").append(...metaBits.map(t => el("span", {text:t})));

  // ---------------------------------------------------------------- panels
  const PANELS = [];
  function panel(id, label, build) { PANELS.push({id, label, build}); }

  panel("result", "Result", root => {
    const strip = el("div", {class:"strip"});
    ORDER.forEach(c => {
      const r = S[c];
      const cell = el("div", {}, [
        el("div", {class:"name"}, [el("i", {class:"swatch", style:`background:${C(c)}`}), el("span", {text:NAMES[c]})]),

    const c1 = card("Historical replay: today's weights held through past episodes",
      "ETFs that did not exist then are proxied (IEFA→EFA, IEMG→EEM, QUAL→IVV, VLUE→IWD, ACWI→IVV/EFA/EEM, EMB→LQD/HYG).", node);
    c1.appendChild(legend(ORDER.map(c => [NAMES[c], C(c)])));
    root.appendChild(c1);
    const proxied = w => Math.max(0, ...D.stress_replay.filter(r => r.window === w)
                                           .map(r => r.proxy_share || 0));
    const wlabels = windows.map(w => proxied(w) > 0.01 ? w + "  (" + pct(proxied(w), 0) + " proxied)" : w);
    new Charts.BarsH(node, {height: 50 + 46 * windows.length, mode:"group", fmt:fPct(0), categories:wlabels,
      labelWidth:230, animate:"barsR", label:"Return in each historical episode",
      series: ORDER.map(c => ({name:NAMES[c], color:cvar[c],
        x: windows.map(w => { const r = D.stress_replay.find(x => x.window === w && x.code === c); return r ? r.replay_return : null; })}))});

    c1.appendChild(note("The proxy share is the weight of the portfolio represented by a stand-in fund in that " +
      "episode. The 2008 replay is " + pct(Math.max(...windows.map(proxied)), 0) + " proxied at its worst, so " +
      "read it as an estimate of how these weights would have behaved rather than as something these " +
      "portfolios lived through. Episodes with no label are held in the actual funds."));

    const realised = D.stress_replay.filter(r => r.realised_return !== null && r.realised_return !== undefined);
    if (realised.length) {
      const ws = [...new Set(realised.map(r => r.window))];
      root.appendChild(card("Realised during the backtest (the weights actually held at the time, net of costs)", null,
        table(["Episode", ...ORDER.map(c => NAMES[c])], ws.map(w => [w, ...ORDER.map(c => {
          const r = realised.find(x => x.window === w && x.code === c);
          return r ? {t: pct(r.realised_return, 1), cls: r.realised_return >= 0 ? "pos" : "neg"} : "n/a";
        })]))));
    }

    const scens = [...new Set(D.stress_scenarios.map(r => r.scenario))];
    root.appendChild(card("Hypothetical shocks", "Bonds by duration, convexity and spread duration; equities by their betas to ACWI and the dollar; gold by assumption.",
      table(["Scenario", ...ORDER.map(c => NAMES[c])], scens.map(s => [s, ...ORDER.map(c => {
        const r = D.stress_scenarios.find(x => x.scenario === s && x.code === c);
        return r ? {t: pct(r.return, 1), cls: r.return >= 0 ? "pos" : "neg"} : "n/a";
      })]))));

    // custom scenario
    const sens = Object.fromEntries(D.sensitivities.map(r => [r.ticker, r]));
    const weights = {};
    ORDER.forEach(c => { weights[c] = D.current_weights.filter(r => r.code === c); });
    const implied = {rates: Number(META.implied_eq_per_1pp_rates), usd: Number(META.implied_eq_per_usd)};
    const fields = [
      ["rates", "10y Treasury yield", -2, 2, 1, 0.25, "pp"],
      ["breakeven", "Breakeven inflation", -1.5, 1.5, 0, 0.25, "pp"],
      ["equity", "ACWI equity move", -50, 30, -15, 5, "%"],
      ["usd", "US dollar", -15, 15, 0, 1, "%"],
      ["ig", "IG credit spread", -1, 3, 0, 0.25, "pp"],
      ["hy", "HY / EM spread", -2, 8, 0, 0.5, "pp"],
      ["gold", "Gold", -30, 30, 0, 5, "%"],
    ];
    const vals = {};
    const ctr = el("div", {class:"controls"});
    const outStrip = el("div", {class:"strip"});
    function shock() {
      const E = vals.equity / 100, U = vals.usd / 100;
      const dy = vals.rates / 100, dbe = vals.breakeven / 100, dreal = dy - dbe;
      const dig = vals.ig / 100, dhy = vals.hy / 100;
      const out = {};
      Object.values(sens).forEach(s => {
        if (s.kind === "equity") out[s.ticker] = s.beta_eq * E + s.beta_usd * U;
        else if (s.kind === "gold") out[s.ticker] = vals.gold / 100;
        else out[s.ticker] = -s.dur * dy + 0.5 * s.dur ** 2 * dy ** 2
                             - s.real_dur * dreal + 0.5 * s.real_dur ** 2 * dreal ** 2
                             - s.ig_sd * dig - s.hy_sd * dhy;
      });
      outStrip.textContent = "";
      ORDER.forEach(c => {
        const v = weights[c].reduce((a, r) => a + r.weight * (out[r.ticker] || 0), 0);
        outStrip.appendChild(el("div", {}, [
          el("div", {class:"name"}, [el("i", {class:"swatch", style:`background:${C(c)}`}), el("span", {text:NAMES[c]})]),
          el("div", {class:"big " + (v >= 0 ? "delta pos" : "delta neg"), text: pct(v, 1)}),
        ]));
      });
    }
    fields.forEach(([key, label, min, max, def, step, unit]) => {
      vals[key] = def;
      const out = el("output", {text: (def > 0 ? "+" : "") + def + unit});
      const input = el("input", {type:"range", id:"sc-" + key, min:String(min), max:String(max),
                                 step:String(step), value:String(def)});
      input.oninput = () => { vals[key] = Number(input.value);
                              out.textContent = (vals[key] > 0 ? "+" : "") + vals[key] + unit; shock(); };
      ctr.appendChild(el("label", {for:"sc-" + key}, [el("span", {text:label}), input, out]));
    });
    root.appendChild(card("Build your own shock", "Move the drivers and the portfolios reprice instantly, using the same sensitivities as the table above.",
      [ctr, outStrip]));
    shock();
  });

  panel("costs", "Costs", root => {
    root.appendChild(card("Rebalancing rules tested on the Strategic 60/40",
      "Same targets, same costs, different trading rule.", table(
        ["Rule", "Return p.a.", "Volatility", "Sharpe", "Max DD", "Tracking error", "Turnover p.a.", "Trades", "Cost p.a."],
        D.rebalance_study.map(r => [r.rule, pct(r.cagr,2), pct(r.vol,2), num(r.sharpe), pct(r.max_dd,1),
                                    pct(r.tracking_error,2), pct(r.turnover_ann,1), String(r.n_rebalances),
                                    r.cost_bps_ann.toFixed(2) + " bp"]))));
    const node = el("div", {class:"chart"});
    const c = card("Annual return as trading costs are scaled up", "1× is the base cost model (1-5bp one-way per ETF).", node);
    c.appendChild(legend(["SAA","MINVAR","QV"].map(x => [NAMES[x], C(x)])));
    root.appendChild(c);
    new Charts.LineMarkers(node, {height:290, fmt:fPct(1), xlabel:"cost multiplier", animate:"line",
      label:"Annual return versus cost multiplier",
      series: ["SAA","MINVAR","QV"].map(code => {
        const rows = D.cost_sensitivity.filter(r => r.code === code).sort((a,b) => a.cost_multiplier - b.cost_multiplier);
        return {name:NAMES[code], color:cvar[code], x:rows.map(r => r.cost_multiplier), y:rows.map(r => r.cagr)};
      })});

    root.appendChild(note("<b>What size this is true at.</b> Costs here are a one-way charge in basis points " +
      "per ETF, covering half the quoted spread plus a fixed impact allowance, applied to the weight actually " +
      "traded. There is no market impact that grows with the size of the order. At a few million dollars that " +
      "is about right. At a few billion it is not: the trade would move the book, the band rule would need a " +
      "participation limit and a multi-day schedule, and the minimum variance portfolio's " +
      pct(S.MINVAR.turnover_ann, 1) + " of annual turnover would be the first thing to break. Read the finding " +
      "as costs did not matter at this size and this turnover, not as costs do not matter."));

    const years = [...new Set(D.turnover_year.map(r => r.year))].sort();
    root.appendChild(card("Turnover and cost by year", null, table(
      ["Year", ...ORDER.flatMap(c => [NAMES[c] + " turnover", NAMES[c] + " cost"])],
      years.map(y => [String(y), ...ORDER.flatMap(c => {
        const r = D.turnover_year.find(x => x.year === y && x.code === c);
        return r ? [pct(r.turnover, 1), r.cost_bps.toFixed(1) + " bp"] : ["n/a", "n/a"];
      })]))));
  });

  panel("method", "Method", root => {
    root.appendChild(card("The three minute version", null, note(
      "I built three multi-asset portfolios out of fourteen US-listed iShares ETFs and ran them against a " +
      "60/40 ACWI and AGG benchmark on daily data from " + META.backtest_start + " to " + META.backtest_end +
      ". One is a plain strategic 60/40 with a fixed regional split and a TIPS sleeve, rebalanced quarterly " +
      "inside a 2.5 point band. One is a long-only minimum variance portfolio re-optimised monthly on a shrunk " +
      "covariance matrix. One is the strategic portfolio with its US equity sleeve split into quality and value " +
      "factor funds, so the only difference between the two is the factor tilt. Weights drift with the market, " +
      "trades happen a day after the signal, and every trade pays a spread. Then I took the difference between " +
      "each portfolio and the benchmark apart three ways: Brinson-Fachler attribution into allocation, " +
      "selection and cost, a ten-factor regression, and stress tests that either replay past episodes or apply " +
      "a shock through duration and beta. I cared more about the decomposition than the backtest: I " +
      "wanted to say which decision produced which basis point, and to prove the pieces add up, which the " +
      "daily identity check does.")));
    const p = el("div", {class:"prose"});
    METHOD.forEach(([h, ...paras]) => {
      if (h) p.appendChild(el("h3", {text:h}));
      paras.forEach(t => p.appendChild(el("p", {text:t})));
    });
    root.appendChild(card(null, null, p));
  });

  const METHOD = [["Universe", "Fourteen US-listed iShares ETFs, USD, total return (dividends reinvested, net of fund fees). Equity: IVV (S&P 500), IEFA (developed ex-US), IEMG (emerging), QUAL and VLUE (MSCI USA Quality and Value factor). Bonds: AGG, TIP, IEF, TLT, SHY, LQD, HYG, EMB. Real assets: IAU (gold). Cash: SHV. Prices, Treasury yields, breakevens and CPI come from Yahoo Finance and FRED; holdings, sectors, countries, currencies and durations come from the iShares holdings files. All of it lands in one SQLite database."], ["Window", "Daily data from 2003; the backtest starts 2013-08-01, the first full month after QUAL listed, so all four portfolios run on the same days. It covers 2015-16, Q4 2018, COVID, 2022, 2023 and April 2025. The 2008 crisis sits before the window and is handled by stress replay with proxies, not by the backtest."], [null, "Portfolios."], [null, "The strategic and quality-value portfolios differ only in the US equity sleeve, so the gap between them is a factor effect and nothing else."], ["Backtest mechanics", "Weights drift daily with returns. Targets are computed from data up to a signal date and executed at the next close (one-day lag, no look-ahead). Trading costs are one-way basis points per ETF (1bp IVV to 5bp VLUE, covering half-spread and impact), charged on the weight actually traded. Turnover is one-way: half the sum of absolute weight changes. Fund fees are already inside total returns. Cash return is SHV; it is also the risk-free rate in Sharpe ratios."], ["Risk", "Volatility, Sharpe, Sortino, maximum drawdown and recovery, tracking error and information ratio versus the benchmark, beta, up/down capture, historical VaR and CVaR at 95%. Ex-ante risk contributions use a Ledoit-Wolf covariance matrix and Euler decomposition, so each holding's contribution sums to portfolio volatility."], ["Exposures", "Look-through: portfolio weight × each fund's holdings gives sector (GICS for equity, issuer type for bonds), country of risk and market currency. Duration comes from the per-bond durations in the iShares files, weighted up to the fund and then to the portfolio; TIPS duration is treated as real duration and reported separately. Spread duration is duration × the fund's credit share."], ["Attribution", "Brinson-Fachler by segment, daily, Carino-linked: allocation is (portfolio weight − benchmark weight) × (segment benchmark return − total benchmark return); selection is benchmark weight × (segment portfolio return − segment benchmark return); interaction is reported with selection. Segment benchmark returns use a reference ETF per segment (IVV, IEFA, IEMG, AGG, TIP, IEF, LQD, IAU, SHV). The benchmark's own regional mix is estimated monthly by returns-based style analysis (Sharpe 1992) of ACWI on IVV/IEFA/IEMG, so allocation can be measured region by region. Two terms close the identity exactly: trading costs, and a benchmark residual (ACWI/AGG versus the composite, fees, small caps, Canada). Effects sum to the active return every single day before linking."], ["Factor model", "Weekly OLS of excess (and active) returns on ten ETF-built factors: equity (ACWI−SHV), size (IWM−IVV), value (IWD−IWF), quality (QUAL−IVV), momentum (MTUM−IVV), rates (IEF−SHV), credit (LQD−IEF), inflation (TIP−IEF), dollar (UUP), gold (IAU−SHV). Return contribution is beta × the factor's realised premium; risk shares are the Euler decomposition of regression variance, with the residual shown as specific risk."], ["Stress tests", "Two kinds. Historical replay holds today's weights through nine past episodes; ETFs that did not exist are proxied (IEFA→EFA, IEMG→EEM, QUAL→IVV, VLUE→IWD, ACWI→IVV/EFA/EEM, EMB→LQD/HYG) and the proxy share is reported beside the result. Hypothetical shocks are instantaneous: bonds by −D·Δy plus convexity plus spread duration × spread change (TIPS on real yields, Δreal = Δnominal − Δbreakeven); equities by their 3-year weekly betas to ACWI and to the dollar; gold by assumption. Scenarios that specify no equity move imply one from ACWI's own regression on 10y yield changes and the dollar."], ["What this is not", "A backtest of fixed rules on ETF price history, not live performance. It ignores taxes, securities lending, bid-ask variation through time, cash drag and capacity, and it uses one holdings snapshot for look-through exposures. Every ETF here still exists, so survivorship is not an issue, but the factor ETFs were chosen with hindsight about which factors are interesting."]];

  // ---------------------------------------------------------------- wire up
  const tabsHost = document.getElementById("tabs");
  const panelHost = document.getElementById("panels");
  PANELS.forEach((p, i) => {
    const btn = el("button", {type:"button", role:"tab", id:"tab-" + p.id, text:p.label});
    btn.setAttribute("aria-selected", String(i === 0));
    btn.setAttribute("aria-controls", "panel-" + p.id);
    tabsHost.appendChild(btn);
    const sec = el("section", {class:"panel stack" + (i === 0 ? " active" : ""), id:"panel-" + p.id, role:"tabpanel"});
    sec.setAttribute("aria-labelledby", "tab-" + p.id);
    panelHost.appendChild(sec);
    p.build(sec);
    btn.onclick = () => {
      PANELS.forEach(q => {
        const on = q.id === p.id;
        document.getElementById("tab-" + q.id).setAttribute("aria-selected", String(on));
        document.getElementById("panel-" + q.id).classList.toggle("active", on);
      });
      const panel = document.getElementById("panel-" + p.id);
      (Charts.REGISTRY || []).forEach(ch => { if (panel.contains(ch.host)) ch.draw(); });
    };
  });
  if (META.data === "SYNTHETIC") {
    panelHost.prepend(el("div", {class:"warn", text:"These figures come from SYNTHETIC test data, not market data."}));
  }
  panelHost.appendChild(el("footer", {}, [el("div", {text:
    "Backtest of fixed rules on ETF price history, not live performance. Prices and macro series from Yahoo Finance and FRED; " +
    "holdings, sectors, countries and durations from iShares holdings files. Built with Python, pandas and SQLite; charts drawn in plain SVG. " +
    "Pipeline run " + META.run_at + "."}),
    el("div", {class:"disclaimer", text:
    "Built as a personal education project, to practise portfolio construction and risk attribution on real data. It is not investment advice and not a recommendation to buy or sell any security. Past performance says nothing about future returns."})]));
})();
</script>
